spring.application.name=distributed-job-scheduler

server.port=${PORT:8000}

scheduler.worker-id=${SCHEDULER_WORKER_ID:worker-default}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_scheduler?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true